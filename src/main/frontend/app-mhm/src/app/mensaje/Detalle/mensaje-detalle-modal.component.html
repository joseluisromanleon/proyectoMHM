<!-- Modal Detalle de Mensaje -->
<div class="modal fade" id="detalleModal" tabindex="-1" aria-labelledby="detalleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detalleModalLabel">Detalle del Mensaje</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="!mensaje">Cargando detalles del mensaje...</div>

        <div class="form-group row">
          <div class="col-12 col-md-6">
            <label for="id">ID:</label>
            <input id="id" type="text" class="form-control" [value]="mensaje?.id" readonly>
          </div>
        </div>
        <div class="form-group row">
          <div class="col-12 col-md-6">
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" class="form-control" [value]="mensaje.nombre" readonly>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
    </div>
  </div>
</div>
