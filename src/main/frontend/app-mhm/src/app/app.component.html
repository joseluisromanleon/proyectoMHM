<div class="container" style="padding:5px;">
  <div class="text-center bg-image " style="
    background-image: url('../assets/image/banner2.png');
    position: relative; /* Para posicionar elementos absolutos dentro del contenedor */
  ">


    <div class="d-flex justify-content-end web" style="position: relative;">
      <div class="text-white">
        <!-- Imagen del logo con clases personalizadas -->
        <a routerLink="/">
          <img src="assets/image/MHM.jpg" alt="Logo MHM" class="logo-img" />
        </a>
        <ul *ngIf="!isLoggedIn" class="d-flex flex-md-row flex-column  mx-4 mt-5"
            style="list-style: none; gap: 10px;">
          <li>
            <a class="btn btn-secondary" routerLink="/login">Login</a>
          </li>
          <li>
            <a class="btn btn-secondary" (click)="onClickNewContact">Contactar</a>
          </li>
        </ul>
      </div>
      <!-- Mensaje de bienvenida si el usuario está logueado para pruebas    -->
      <div *ngIf="isLoggedIn" class="mt-3">
<!--   <h4 class="text-white">¡Bienvenido Eliminar{{ username}}!</h4>-->
       <h4 class="text-white">¡Bienvenido Eliminar!</h4>

      </div>
    </div>

    <!-- Máscara con título -->
    <div class="mask d-flex justify-content-center align-items-center"
         style="background-color: rgba(0, 0, 0, 0.2); position: absolute; top: 50%; left: 0; width: 100%; height: 50%; z-index: 1;">
      <h1 class="mt-2">Mediterranea de Hostelería Malagueña</h1>
    </div>
  </div>
    <app-carrusel></app-carrusel>
    <router-outlet></router-outlet>
</div>
