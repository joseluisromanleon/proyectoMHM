<div class="modal-header bg-secondary">
  <h5 class="modal-title">Registro de Usuario</h5>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="onCancel()"></button>
</div>
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div class="modal-body">
    <!-- Usuario -->
    <div class="mb-3">
      <label for="register-username" class="form-label">Usuario</label>
      <input type="text" id="register-username" class="form-control" formControlName="userName" required maxlength="100"
             placeholder="Introduce tu nombre de usuario"
             [ngClass]="{'is-invalid': (f['userName'].touched || submitted) && f['userName'].invalid}">
      <div *ngIf="(f['userName'].touched || submitted) && f['userName'].invalid" class="text-danger">
        <div *ngIf="f['userName'].errors?.['required']">El usuario es obligatorio.</div>
        <div *ngIf="f['userName'].errors?.['maxlength']">Máximo 100 caracteres.</div>
      </div>
    </div>
    <!-- Email -->
    <div class="mb-3">
      <label for="userEmail" class="form-label">Correo electrónico</label>
      <input type="email" id="userEmail" class="form-control" formControlName="userEmail"
             placeholder="ejemplo@email.com"
             [ngClass]="{'is-invalid': (f['userEmail'].touched || submitted) && f['userEmail'].invalid}">
      <div *ngIf="(f['userEmail'].touched || submitted) && f['userEmail'].invalid" class="text-danger">
        <div *ngIf="f['userEmail'].errors?.['email']">Debe ser un correo válido.</div>
        <div *ngIf="f['userEmail'].errors?.['maxlength']">Máximo 100 caracteres.</div>
      </div>
    </div>
    <!-- Contraseña -->
    <div class="mb-3">
      <label for="userPassword" class="form-label">Contraseña</label>
      <input type="password" id="userPassword" class="form-control" formControlName="userPassword"
             placeholder="Contraseña"
             [ngClass]="{'is-invalid': (f['userPassword'].touched || submitted) && f['userPassword'].invalid}">
      <div *ngIf="(f['userPassword'].touched || submitted) && f['userPassword'].invalid" class="text-danger">
        <div *ngIf="f['userPassword'].errors?.['required']">La contraseña es obligatoria.</div>
      </div>
    </div>
    <!-- Checkbox de condiciones -->
    <div class="form-check mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        id="userAceptaCondiciones"
        formControlName="userAceptaCondiciones"
        [ngClass]="{'is-invalid': submitted && f['userAceptaCondiciones'].invalid}">
      <label class="form-check-label" for="userAceptaCondiciones">
        Acepto las condiciones de uso de datos y cookies
      </label>
      <div *ngIf="submitted && f['userAceptaCondiciones'].errors" class="text-danger">
        Debe aceptar las condiciones para enviar el mensaje.
      </div>
    </div>
    <input type="hidden" formControlName="enabled">
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-success" [disabled]="registerForm.invalid">Registrar</button>
    <button type="button" class="btn btn-warning" (click)="onCancel()">Cerrar</button>
  </div>
</form>
